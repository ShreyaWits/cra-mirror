syntax = "proto3";

package messaging_proto;

option go_package = "messaging_service/protos/messaging_service";

// The messaging service definition
service MessagingService {
  // Publish a message to a Kafka topic
  rpc PublishMessage(PublishRequest) returns (PublishResponse) {}
  
  // Subscribe to messages from a Kafka topic
  rpc Subscribe(SubscribeRequest) returns (stream KafkaMessage) {}
  
  // Create a new Kafka topic
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse) {}
}

// Request to publish a message
message PublishRequest {
  string topic = 1;  // Required: The Kafka topic to publish to
  map<string, string> value = 2;  // Required: The message payload
  ProducerConfig producer_config = 3;  // Optional: Producer configuration
  map<string, string> headers = 4;  // Optional: Message headers
  string key = 5;  // Optional: Message key for partitioning
}

// Response after publishing a message
message PublishResponse {
  string status = 1;  // Success or error status
  string message = 2;  // Status message
  int32 partition = 3;  // Partition where the message was published
  int64 offset = 4;  // Offset of the published message
  int64 timestamp = 5;  // Timestamp when the message was published
}

// Request to subscribe to a topic
message SubscribeRequest {
  string topic = 1;  // Required: The Kafka topic to subscribe to
  string group_id = 2;  // Required: Consumer group ID
  ConsumerConfig consumer_config = 3;  // Optional: Consumer configuration
}

// Kafka message structure
message KafkaMessage {
  map<string, string> value = 1;  // Message payload
  int64 timestamp = 2;  // Message timestamp
  string key = 3;  // Message key
  map<string, string> headers = 4;  // Message headers
}

// Request to create a new topic
message CreateTopicRequest {
  string topic = 1;  // Required: Name of the topic to create
  int32 num_partitions = 2;  // Required: Number of partitions
  int32 replication_factor = 3;  // Required: Replication factor
  map<string, string> config = 4;  // Optional: Topic configuration
}

// Response after creating a topic
message CreateTopicResponse {
  string status = 1;  // Success or error status
  string message = 2;  // Status message
  repeated string validation_errors = 4;  // Any validation errors
}

// Producer configuration
message ProducerConfig {
  bool enable_idempotence = 1;  // Enable idempotent producer
  int32 retries = 2;  // Number of retries
  int32 retry_backoff_ms = 3;  // Backoff time between retries
  int32 request_timeout_ms = 4;  // Request timeout
  int32 max_in_flight_requests = 5;  // Max in-flight requests
  bool enable_compression = 6;  // Enable message compression
  string compression_type = 7;  // Compression type (gzip, snappy, etc.)
  string delivery_semantics = 8;  // Delivery semantics: "at-least-once" (default) or "exactly-once"
}

// Consumer configuration
message ConsumerConfig {
  int32 max_wait_ms = 1;  // Maximum time to wait for messages
  int32 read_backoff_min_ms = 2;  // Minimum backoff between reads
  int32 read_backoff_max_ms = 3;  // Maximum backoff between reads
  int32 commit_interval_ms = 4;  // Offset commit interval
  int32 heartbeat_interval_ms = 5;  // Consumer group heartbeat interval
  int32 session_timeout_ms = 6;  // Session timeout
  int32 rebalance_timeout_ms = 7;  // Rebalance timeout
  int32 max_attempts = 8;  // Maximum read attempts
  string isolation_level = 9;  // Kafka isolation level: "read_committed" or "read_uncommitted" (default)
  string auto_offset_reset = 10;  // Offset reset behavior: "latest" or "earliest"
}
