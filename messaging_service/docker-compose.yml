version: '3.8'

services:
  messaging_service:
    build:
      context: ../
      dockerfile: ./messaging_service/Dockerfile
    ports:
      - "50054:50054"
      - "5055:5055"
    networks:
      - messaging-service-network
    environment:
      GRPC_PORT: 50054
      # Kafka connection settings
      KAFKA_BROKERS: kafka1:9092,kafka2:9093,kafka3:9094
      # Kafka topic configuration
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 3
      # Kafka producer configuration for performance and reliability
      KAFKA_BATCH_SIZE: 100
      KAFKA_BATCH_BYTES: 1048576
      KAFKA_BATCH_TIMEOUT_MS: 500
      KAFKA_COMPRESSION_CODEC: snappy
      KAFKA_MAX_ATTEMPTS: 5
      KAFKA_RETRY_BACKOFF_MS: 250
      KAFKA_READ_TIMEOUT_MS: 5000
      KAFKA_WRITE_TIMEOUT_MS: 5000
      # Consumer configuration
      KAFKA_CONSUMER_MAX_WAIT_MS: 5000
      KAFKA_CONSUMER_COMMIT_INTERVAL_MS: 5000
      KAFKA_CONSUMER_SESSION_TIMEOUT_MS: 30000
      KAFKA_CONSUMER_HEARTBEAT_MS: 1000
      KAFKA_CONSUMER_MAX_POLL_RECORDS: 500
      KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      KAFKA_ENABLE_AUTO_COMMIT: "false"
      # Exactly-once configuration
      KAFKA_ISOLATION_LEVEL: read_committed
      CONFIG_SERVICE_URL: http://host.docker.internal:4001/api/v1
      CONFIG_SERVICE_TOKEN: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhZG1pbiI6dHJ1ZSwiZXhwIjoxNzQ3MzE3NDI1fQ.vf4v4ZG6Wm6cIhy5l4G5L3MrabOtxNRnj7Bi97KgQl4
      ENVIRONMENT: dev
      HttpPort: 5055

    depends_on:
      - kafka1
      - kafka2
      - kafka3
      - zookeeper1
      - zookeeper2
      - zookeeper3
    restart: on-failure

  # Define the first Zookeeper node
  zookeeper1:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper1
    hostname: zookeeper1
    networks:
      - messaging-service-network
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      # Unique ID for this zookeeper node
      ZOOKEEPER_SERVER_ID: 1
      # List all zookeeper nodes in the ensemble
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    volumes:
      # Use a unique volume for each zookeeper's data
      - zookeeper1_data:/var/lib/zookeeper/data
    restart: on-failure

  # Define the second Zookeeper node
  zookeeper2:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper2
    hostname: zookeeper2
    networks:
      - messaging-service-network
    ports:
      - "2182:2182" # Map to a different host port if needed
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182 # Listen on a different internal port if needed
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 2
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    volumes:
      - zookeeper2_data:/var/lib/zookeeper/data
    restart: on-failure

  # Define the third Zookeeper node
  zookeeper3:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper3    
    networks:
      - messaging-service-network
    hostname: zookeeper3
    ports:
      - "2183:2183" # Map to a different host port if needed
    environment:
      ZOOKEEPER_CLIENT_PORT: 2183 # Listen on a different internal port if needed
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 3
      ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
    volumes:
      - zookeeper3_data:/var/lib/zookeeper/data
    restart: on-failure

  # Define the first Kafka broker
  kafka1:
    image: confluentinc/cp-kafka:latest
    container_name: kafka1
    hostname: kafka1
    networks:
      - messaging-service-network    
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9092:9092" # Expose to host on port 9092
    environment:
      KAFKA_BROKER_ID: 1 # Unique ID for this broker
      # Update Zookeeper connection string to include all Zookeeper nodes
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2182,zookeeper3:2183
      # Advertised listener uses the hostname within the Docker network
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:9092
      # Listen internally on all interfaces
      KAFKA_LISTENERS: PLAINTEXT://kafka1:9092
      # Replication factor for internal topics should be at least the number of brokers
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Disable auto topic creation in production
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # Set to "false" for production
      # Transaction configuration
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 15000
      # Additional Kafka settings for stability
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 1000
      KAFKA_LOG_RETENTION_HOURS: 168 # 7 days
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3 

    volumes:
      # Use a unique volume for each broker's data
      - kafka1_data:/var/lib/kafka/data
    restart: on-failure

  # Define the second Kafka broker
  kafka2:
    image: confluentinc/cp-kafka:latest
    container_name: kafka2
    hostname: kafka2
    networks:
      - messaging-service-network
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9093:9093" # Expose to host on a different port
    environment:
      KAFKA_BROKER_ID: 2 # Unique ID for this broker
      # Update Zookeeper connection string to include all Zookeeper nodes
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2182,zookeeper3:2183
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka2:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # Set to "false" for production
      # Transaction configuration
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 15000
      # Additional Kafka settings for stability
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 1000
      KAFKA_LOG_RETENTION_HOURS: 168 # 7 days
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka2_data:/var/lib/kafka/data
    restart: on-failure

  # Define the third Kafka broker
  kafka3:
    image: confluentinc/cp-kafka:latest
    container_name: kafka3
    hostname: kafka3
    networks:
      - messaging-service-network
    depends_on:
      - zookeeper1
      - zookeeper2
      - zookeeper3
    ports:
      - "9094:9094" # Expose to host on another different port
    environment:
      KAFKA_BROKER_ID: 3 # Unique ID for this broker
      # Update Zookeeper connection string to include all Zookeeper nodes
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2182,zookeeper3:2183
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_LISTENERS: PLAINTEXT://kafka3:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" # Set to "false" for production
      # Transaction configuration
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_MAX_TIMEOUT_MS: 15000
      # Additional Kafka settings for stability
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_LOG_FLUSH_INTERVAL_MS: 1000
      KAFKA_LOG_RETENTION_HOURS: 168 # 7 days
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka3_data:/var/lib/kafka/data
    restart: on-failure

volumes:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  zookeeper1_data:
  zookeeper2_data:
  zookeeper3_data:

networks:
  messaging-service-network:
    external: true

# Command to start the service:
# docker compose -f 'messaging_service/docker-compose.yml' up --build 'messaging_service'