version: "3.8"

networks:
  protected-link:

volumes:
  cassandra_data:

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: protected-link
    ports:
      - "${PORT:-8080}:8080"
      - "50051:50051" 
    depends_on:
      - redis
      - cassandra
      - kafka
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - protected-link

  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass ${DB_PASSWORD}
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    networks:
      - protected-link

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - protected-link

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - protected-link

  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=ProtectedLinkCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - protected-link

  cassandra-init:
    image: cassandra:latest
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-init:/cassandra-init
    command: >
      /bin/bash -c "
        echo 'Waiting for Cassandra to start...' &&
        sleep 30 &&
        echo 'Initializing Cassandra schema...' &&
        cqlsh cassandra -f /cassandra-init/init.cql
      "
    restart: on-failure
    networks:
      - protected-link
