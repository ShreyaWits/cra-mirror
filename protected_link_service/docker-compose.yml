version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: protected-link
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      - redis
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
