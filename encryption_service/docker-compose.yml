version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: sh -c "
      vault server -dev -dev-root-token-id=root &
      sleep 5 &&
      export VAULT_ADDR='http://127.0.0.1:8200' &&
      export VAULT_TOKEN='root' &&
      vault secrets enable transit &&
      wait"

  encryption-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${ENCRYPTION_SERVICE_REST_PORT}:${ENCRYPTION_SERVICE_REST_PORT}"
      - "${ENCRYPTION_SERVICE_GRPC_PORT}:${ENCRYPTION_SERVICE_GRPC_PORT}"
    environment:
     - ENVIRONMENT=${ENVIRONMENT}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - HASHICORP_VAULT_ADDR=${HASHICORP_VAULT_ADDR}
      - HASHICORP_VAULT_TOKEN=${HASHICORP_VAULT_TOKEN}
      - HASHICORP_VAULT_PATH=${HASHICORP_VAULT_PATH}
      - ENCRYPTION_SERVICE_REST_PORT=${ENCRYPTION_SERVICE_REST_PORT}
      - ENCRYPTION_SERVICE_GRPC_PORT=${ENCRYPTION_SERVICE_GRPC_PORT}
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - ENCRYPTION_CONFIG_SERVICE_TOKEN=${ENCRYPTION_CONFIG_SERVICE_TOKEN}
      - CACHING_SERVICE_GRPC_URL=${CACHING_SERVICE_GRPC_URL}
      - ENCRYPTION_SERVICE_REDIS_TTL=${ENCRYPTION_SERVICE_REDIS_TTL}
      - OBSERVABILITY_URL=${OBSERVABILITY_URL}
    depends_on:
      vault:
        condition: service_healthy

volumes:
  vault-data: 