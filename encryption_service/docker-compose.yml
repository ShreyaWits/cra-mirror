version: '3.8'

services:
  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
    healthcheck:
      test: ["CMD", "sh", "-c", "VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: sh -c "
      vault server -dev -dev-root-token-id=root &
      sleep 5 &&
      export VAULT_ADDR='http://127.0.0.1:8200' &&
      export VAULT_TOKEN='root' &&
      vault secrets enable transit &&
      wait"

  encryption-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
      - "50051:50051"
    environment:
      - REST_PORT=${REST_PORT:-8082}
      - HASHICORP_VAULT_ADDR=${HASHICORP_VAULT_ADDR:-http://vault:8200}
      - HASHICORP_VAULT_TOKEN=${HASHICORP_VAULT_TOKEN:-root}
      - HASHICORP_VAULT_PATH=${HASHICORP_VAULT_PATH:-secret/data/path}
      - GRPC_PORT=${GRPC_PORT:-50051}
    depends_on:
      vault:
        condition: service_healthy

volumes:
  vault-data: 