syntax = "proto3";

package redis.cache.v1;

option go_package = "redis-service/proto";

// ----------------------
// Request/Response Types
// ----------------------

// Payload for setting a cache entry
message SetCacheRequest {
  string namespace = 1;     // Service namespace (e.g., serviceA)
  string key = 2;           // Redis key
  string value = 3;         // Serialized value (JSON/String)
  int64 ttl = 4;            // Time-to-live in seconds
  string tracking_id = 5;   // Tracking ID to trace requests across services
}

// Response for SetCache
message SetCacheResponse {
  bool success = 1;
  string message = 2; // Optional message or status
}

// Payload for getting a cache entry
message GetCacheRequest {
  string namespace = 1;
  string key = 2;
  string tracking_id = 3; // Optional tracking ID for observability
}

// Response for GetCache
message GetCacheResponse {
  string value = 1;
  bool found = 2;
  string message = 3;         // Optional status message
  string error = 4;
}

// Payload for invalidating a cache entry
message InvalidateCacheRequest {
  string namespace = 1;
  string key = 2;
  string tracking_id = 3; // Optional tracking ID
}

// Response for InvalidateCache
message InvalidateCacheResponse {
  bool success = 1;
  string message = 2; // Optional status or error message
}

// ----------------------
// Cache gRPC Service
// ----------------------
service CacheService {
  rpc SetCache(SetCacheRequest) returns (SetCacheResponse);
  rpc GetCache(GetCacheRequest) returns (GetCacheResponse);
  rpc InvalidateCache(InvalidateCacheRequest) returns (InvalidateCacheResponse);
}