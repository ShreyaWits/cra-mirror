syntax = "proto3";

package template;

option go_package = "./proto";

service TemplateService {
  rpc GetTemplate(GetTemplateRequest) returns (TemplateResponse);
}

message GetTemplateRequest {
  string id = 1;
  string name = 2;
  string channel = 4;
  string language = 5;
}

message TemplateResponse {
  bool Success = 1;
  string Message = 2;
  string Error= 3;
  map<string, string> data = 4;
}