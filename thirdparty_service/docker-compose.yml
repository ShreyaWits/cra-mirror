services:
  cra-thirdparty-service:
    build:
      context: .. # Change build context to the workspace root
      dockerfile: thirdparty_service/Dockerfile # Update dockerfile path
    container_name: cra-thirdparty-service

    restart: always
    ports:
      - "8080:8080"  
      - "9090:9090"

    environment:
      - ENVIRONMENT=development
      - SERVICE_NAME=thirdparty-service
      - CONFIG_SERVICE_URL=http://host.docker.internal:8001/api/v1
      - CONFIG_SERVICE_USERNAME=adminTest
      - CONFIG_SERVICE_PASSWORD=Test@1234
      - OTEL_COLLECTOR_URL=host.docker.internal:4317
      - CACHING_SERVICE_GRPC_URL=host.docker.internal:50505
