version: '3.8'

networks:
  template-services-network: {}

services:
  template-service:
    build: .
    ports:
      - "${TEMPLATE_SERVICE_GRPC_PORT}:${TEMPLATE_SERVICE_GRPC_PORT}"
      - "${TEMPLATE_SERVICE_REST_PORT}:${TEMPLATE_SERVICE_REST_PORT}"
    depends_on:
      yugabyte:
        condition: service_started
      # redis:
      #   condition: service_healthy
    environment:
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - CONFIG_SERVICE_TOKEN=${TEMPLATE_CONFIG_SERVICE_TOKEN}
      - CACHE_SERVICE_ADDR=${CACHING_SERVICE_GRPC_URL}
      - ENVIRONMENT=${ENVIRONMENT}
    restart: on-failure
  yugabyte:
    container_name: yugabyte
    image: yugabytedb/yugabyte:latest
    command: ["bin/yugabyted", "start", "--background=false"]
    ports:
      - "5435:5433"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5433"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

