version: '3.8'

networks:
  template-services-network: {}

services:
  template-service:
    build: .
    ports:
      - "50053:50053"  # gRPC
      - "5000:8080"    # REST
    depends_on:
      yugabyte:
        condition: service_started
      # redis:
      #   condition: service_healthy
    environment:
      - CONFIG_SERVICE_URL=${CONFIG_SERVICE_URL}
      - ENVIRONMENT=${ENVIRONMENT}
      - CONFIG_SERVICE_TOKEN=${CONFIG_SERVICE_TOKEN}
      - CACHE_SERVICE_ADDR=${CACHE_SERVICE_ADDR}
      - OTEL_COLLECTOR_GRPC_ENDPOINT=${OTEL_COLLECTOR_GRPC_ENDPOINT}

  yugabyte:
    container_name: yugabyte
    image: yugabytedb/yugabyte:latest
    command: ["bin/yugabyted", "start", "--background=false"]
    ports:
      - "5435:5433"
      # - "9042:9042"
      # - "15433:15433"
      # - "7001:7000"
      # - "9000:9000"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5433"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # redis:
