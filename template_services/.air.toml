root = "."
tmp_dir = "tmp"

[build]
  # Update the build command to point to cmd/main.go
  cmd = "go build -o ./tmp/main ./cmd/server/main.go" 
  bin = "tmp/main"
  full_bin = ""
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor"]
  exclude_file = []
  follow_symlink = false

[log]
  time = true

[color]
  main = "yellow"
  watcher = "cyan"
  build = "green"
  runner = "magenta"