version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - notification-service

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - notification-service

  cassandra:
    image: cassandra:latest
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch

    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - notification-service
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 5

  cassandra-init:
    image: cassandra:latest
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra-init:/cassandra-init
    command: >
      /bin/bash -c "
        echo 'Waiting for Cassandra to start...' &&
        sleep 30 &&
        echo 'Initializing Cassandra schema...' &&
        cqlsh cassandra -f /cassandra-init/init.cql
      "
    restart: on-failure
    networks:
      - notification-service

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686" # Jaeger UI
      - "14250:14250"
      - "14268:14268" # Jaeger collector
      - "9411:9411"
    environment:
      - COLLECTOR_ZIPKIN_HTTP_PORT=9411
    networks:
      - notification-service

  temporal-server:
    image: temporalio/auto-setup:1.19.0
    restart: always
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=cassandra
      - CASSANDRA_SEEDS=cassandra:9042
      - CASSANDRA_KEYSPACE=temporal
      - CASSANDRA_LOCAL_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_HOSTS=cassandra:9042
      - KAFKA_SERVER_URL=kafka:29092
    networks:
      - notification-service
    depends_on:
      cassandra:
        condition: service_healthy

  notification-service:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    environment:
      - PORT=50051
      - CASSANDRA_HOST=cassandra
      - REDIS_HOST=redis
      - TEMPORAL_URL=temporal-server:7233
      - KAFKA_SERVER_URL=kafka:29092
    ports:
      - "50051:50051"
    networks:
      - notification-service
    depends_on:
      cassandra:
        condition: service_healthy
      jaeger:
        condition: service_started

  temporal-worker:
    build:
      context: ./
      dockerfile: Dockerfile.worker
    restart: always
    ports:
      - "5000:5000"
    environment:
      - TEMPORAL_SERVER_URL=temporal-server:7233
      - CASSANDRA_HOST=cassandra
      - REDIS_HOST=redis
    networks:
      - notification-service
    depends_on:
      cassandra:
        condition: service_healthy
      temporal-server:
        condition: service_started

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - notification-service

networks:
  notification-service:
    # external: true

volumes:
  redis-data:
  cassandra_data:
    driver: local
