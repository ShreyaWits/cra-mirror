version: '3.8'

services:
  nps-config-service:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: nps-config-service
      # restart: always
      networks:
        - nps2.0
      ports:
        - "4002:3006"
      environment:
        - PORT=3006
        - ETCD_ENDPOINT=http://etcd:2379
        - IS_DOCKER=true
  etcd:
    image: quay.io/coreos/etcd:v3.5.15 # Use the latest stable version
    container_name: etcd
    ports:
      - "2379:2379" # Client port
      - "2380:2380" # Peer port
    environment:
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_NAME=etcd-node-1
      - ETCD_INITIAL_CLUSTER=etcd-node-1=http://etcd:2380
    volumes:
      - etcd_data:/etcd-data
    networks:
      - nps2.0

volumes:
  etcd_data:
    driver: local

networks:
  nps2.0:
    driver: bridge